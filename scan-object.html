<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1366, height=768, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCANCORE-3D OS - Object Scan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/ai-chat.css">
    
    <!-- CSS Specific -->
    <link rel="stylesheet" href="css/scanner.css">
</head>
<body class="dark-theme">

    <div id="app-wrapper" style="opacity: 1; display: flex; flex-direction: column; height: 100%; width: 100%;">
        
        <!-- HEADER COMUN -->
        <header>
            <div class="brand" data-action="nav" data-target="main-menu" style="cursor: pointer;">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                SCANCORE-3D
            </div>
            <div class="nav-tabs">
                <div class="nav-tab active" data-action="nav" data-target="main-menu">Main Menu</div>
                <div class="nav-tab" data-action="nav" data-target="library">Library</div>
                <div class="nav-tab" data-action="nav" data-target="help-screen">Help</div>
            </div>
            <div class="system-status">
                <span id="clock">00:00</span>
                <svg viewBox="0 0 24 24" class="status-icon" id="btn-theme" title="Toggle Theme"></svg>
                
                <svg viewBox="0 0 24 24" class="status-icon" data-modal="bt-modal" title="Bluetooth"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></svg>
                
                <!-- THE NEW GLOBE (Default state visible, matching the requested image) -->
                <!-- THE NEW GLOBE (Acum poate fi apăsat pentru a deschide Wi-Fi) -->
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-no-net" title="No Network - Click to connect" data-modal="wifi-modal" style="cursor: pointer;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    <line x1="4" y1="4" x2="20" y2="20" stroke-width="3" stroke="var(--bg-primary)"></line>
                    <line x1="4" y1="4" x2="20" y2="20"></line>
                </svg>

                <!-- ETHERNET (Hidden initially) -->
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-ethernet" style="display: none;" title="Ethernet Connected">
                    <rect x="4" y="4" width="16" height="12" rx="2" ry="2"></rect><line x1="12" y1="16" x2="12" y2="20"></line><line x1="8" y1="20" x2="16" y2="20"></line>
                </svg>

                <!-- WI-FI (Hidden initially) -->
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-wifi" style="display: none;" data-modal="wifi-modal" title="Wi-Fi">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>

                <!-- SETTINGS -->
                <svg viewBox="-2 -2 28 28" class="status-icon" id="icon-settings" data-action="nav" data-target="settings-screen" title="Settings">
                    <g transform="scale(0.85) translate(2.1, 2.1)">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </g>
                </svg>
            </div>
        </header>

        <main>
            <!-- OBJECT SCAN SCREEN -->
            <section id="pre-scan" class="screen active">
                <div class="screen-header">
                    <div class="screen-title-group">
                        <h1><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg> Object Preparation</h1>
                        <div class="screen-subtitle">Configure environment for optimal object capture.</div>
                    </div>
                </div>
                
                <div class="settings-panel scrollable-panel" style="max-height: 480px; overflow-y: auto; padding-right: 16px; width: 100%; max-width: 900px; margin: 0 auto;">
                    <button class="btn-primary" id="btn-start-obj-prep" style="margin-bottom: 24px; width: 100%;">▶ Prepare Scan</button>

                    <div class="settings-grid">
                        <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                            <label class="setting-row-title">Z-Axis Height (50-150 mm)</label>
                            <input type="number" id="cfg-obj-z" min="50" max="150" value="100" style="width:100%; padding: 8px; border-radius: 6px; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--neutral-border);">
                        </div>
                        <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                            <label class="setting-row-title">Turntable Rotation (Degrees)</label>
                            <select id="cfg-obj-turntable" style="width:100%; padding: 8px; border-radius: 6px; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--neutral-border);">
                                <option value="15">15°</option>
                                <option value="18" selected>18°</option>
                                <option value="20">20°</option>
                                <option value="22.5">22.5°</option>
                                <option value="24">24°</option>
                                <option value="30">30°</option>
                                <option value="36">36°</option>
                            </select>
                        </div>
                        
                        <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                            <label class="setting-row-title">Photo Resolution</label>
                            <select id="cfg-obj-photo-res" style="width:100%; padding: 8px; border-radius: 6px; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--neutral-border);">
                                <option value="4056x3040">4056x3040 (12.3MP - Native 4:3)</option>
                                <option value="2028x1520">2028x1520 (3.0MP - Binned 4:3)</option>
                                <option value="1920x1080" selected>1920x1080 (2.0MP - FHD 16:9)</option>
                            </select>
                        </div>
                        <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                            <div style="display:flex; justify-content: space-between; width: 100%;">
                                <label class="setting-row-title">Photo Quality (%)</label>
                                <span id="cfg-obj-photo-q-val">90</span>
                            </div>
                            <input type="range" id="cfg-obj-photo-q" min="10" max="100" value="90" style="width: 100%;">
                        </div>
                    </div>

                    <div style="margin-top: 16px; margin-bottom: 16px;">
                        <button class="btn-secondary" id="btn-toggle-adv" style="width: 100%; justify-content: center; min-height: 40px; font-size: 0.9rem;">
                            Show Advanced Settings ▼
                        </button>
                    </div>

                    <div id="advanced-settings-container" style="display: none; flex-direction: column; gap: 16px;">
                        <div class="settings-grid">
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                                <label class="setting-row-title">Preview Resolution</label>
                                <select id="cfg-obj-preview-res" style="width:100%; padding: 8px; border-radius: 6px; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--neutral-border);">
                                    <option value="1920x1080">1920x1080 (FHD 16:9)</option>
                                    <option value="1012x760" selected>1012x760 (Preview 4:3)</option>
                                    <option value="640x480">640x480 (VGA 4:3)</option>
                                </select>
                            </div>
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                                <div style="display:flex; justify-content: space-between; width: 100%;">
                                    <label class="setting-row-title">Stream Quality (%)</label>
                                    <span id="cfg-adv-stream-q-val">80</span>
                                </div>
                                <input type="range" id="cfg-adv-stream-q" min="10" max="100" value="80" style="width: 100%;">
                            </div>
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                                <div style="display:flex; justify-content: space-between; width: 100%;">
                                    <label class="setting-row-title">Motor Acceleration (deg/s²)</label>
                                    <span id="cfg-adv-acc-val">10</span>
                                </div>
                                <input type="range" id="cfg-adv-acc" min="1" max="100" value="10" style="width: 100%;">
                            </div>
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                                <div style="display:flex; justify-content: space-between; width: 100%;">
                                    <label class="setting-row-title">Motor Deceleration (deg/s²)</label>
                                    <span id="cfg-adv-dec-val">10</span>
                                </div>
                                <input type="range" id="cfg-adv-dec" min="1" max="100" value="10" style="width: 100%;">
                            </div>
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                                <div style="display:flex; justify-content: space-between; width: 100%;">
                                    <label class="setting-row-title">Camera Brightness (%)</label>
                                    <span id="cfg-adv-bright-val">50</span>
                                </div>
                                <input type="range" id="cfg-adv-bright" min="0" max="100" value="50" style="width: 100%;">
                            </div>
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                                <div style="display:flex; justify-content: space-between; width: 100%;">
                                    <label class="setting-row-title">LED Intensity (0.0 - 1.0)</label>
                                    <span id="cfg-adv-led-val">0.5</span>
                                </div>
                                <input type="range" id="cfg-adv-led" min="0" max="1" step="0.1" value="0.5" style="width: 100%;">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- MODALS GLOBALE -->
            <div class="overlay" id="modal-overlay"></div>
            <div class="os-modal" id="wifi-modal">
                <div class="modal-header">
                    <div class="modal-title"><svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg> Wi-Fi</div>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <button class="close-btn" data-close="wifi-modal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
                <div class="modal-body list-view" id="wifi-list"></div>
            </div>
            <div class="os-modal" id="bt-modal">
                <div class="modal-header">
                    <div class="modal-title"><svg viewBox="0 0 24 24"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></svg> Bluetooth</div>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <button class="close-btn" data-close="bt-modal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
                <div class="modal-body list-view" id="bt-list"></div>
            </div>

            <!-- AI CHAT -->
            <div class="ai-modal" id="ai-modal">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--neutral-border); padding-bottom: 12px;">
                    <span style="font-weight: 600; display:flex; align-items:center; gap:8px;"><svg viewBox="0 0 24 24" style="width:18px;height:18px; color:var(--accent);"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path></svg> ScanAssist AI</span>
                    <div style="display: flex; gap: 8px;">
                        <svg viewBox="0 0 24 24" style="width:20px;height:20px; cursor:pointer; color:var(--text-muted);" id="clear-ai" title="Clear Chat History"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        <svg viewBox="0 0 24 24" style="width:24px;height:24px; cursor:pointer; color:var(--text-muted);" id="close-ai" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                </div>
                <div id="ai-chat-history" class="scrollable-panel" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 10px 0; padding-right: 5px;"></div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <input type="text" id="ai-input" placeholder="Ask ScanAssist..." style="flex:1; background:var(--bg-primary); border:1px solid var(--neutral-border); color:var(--text-main); padding:10px; border-radius:6px; font-family:var(--font-main);">
                    <button id="ai-send-btn" style="background:var(--accent); border:none; border-radius:6px; padding:10px; cursor:pointer;"><svg viewBox="0 0 24 24" style="width:16px;height:16px; stroke:var(--bg-primary);"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
                </div>
            </div>

            <div class="fab" id="btn-fab">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path></svg>
                <div><div style="font-size: 0.95rem;">SCANASSIST</div><div style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">AI Guidance</div></div>
            </div>

        </main>
    </div>

    <!-- Scripturi -->
    <script src="js/global.js"></script>
    <script src="js/network.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/scanner.js"></script>
</body>
</html>
