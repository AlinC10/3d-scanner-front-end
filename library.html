<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1366, height=768, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCANCORE-3D OS - Library</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/ai-chat.css">
    <link rel="stylesheet" href="css/keyb.css">
    
    <!-- CSS Specific -->
    <link rel="stylesheet" href="css/library.css">

    <!-- Librării Three.js pentru Viewer 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body class="dark-theme">

    <div id="app-wrapper" style="display: flex; flex-direction: column; height: 100%; width: 100%;">
        <!-- HEADER COMUN -->
        <header>
            <div class="brand" data-action="nav" data-target="main-menu" style="cursor: pointer;">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                SCANCORE-3D
            </div>
            <div class="nav-tabs">
                <div class="nav-tab" data-action="nav" data-target="main-menu">Main Menu</div>
                <div class="nav-tab active" data-action="nav" data-target="library">Library</div>
                <div class="nav-tab" data-action="nav" data-target="help-screen">Help</div>
            </div>
            <div class="system-status">
                <span id="clock">00:00</span>
                <svg viewBox="0 0 24 24" class="status-icon" id="btn-theme" title="Toggle Theme"></svg>
                <svg viewBox="0 0 24 24" class="status-icon" data-modal="bt-modal" title="Bluetooth"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-no-net" title="No Network - Click to connect" data-modal="wifi-modal" style="cursor: pointer;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    <line x1="4" y1="4" x2="20" y2="20" stroke-width="3" stroke="var(--bg-primary)"></line>
                    <line x1="4" y1="4" x2="20" y2="20"></line>
                </svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-ethernet" style="display: none;" title="Ethernet Connected">
                    <rect x="4" y="4" width="16" height="12" rx="2" ry="2"></rect><line x1="12" y1="16" x2="12" y2="20"></line><line x1="8" y1="20" x2="16" y2="20"></line>
                </svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-wifi" style="display: none;" data-modal="wifi-modal" title="Wi-Fi">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <svg viewBox="-2 -2 28 28" class="status-icon" id="icon-settings" data-action="nav" data-target="settings-screen" title="Settings">
                    <g transform="scale(0.85) translate(2.1, 2.1)">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </g>
                </svg>
            </div>
        </header>

        <main style="flex: 1; overflow: hidden; padding: 20px;">
            
            <section id="library-grid-view" style="height: 100%; display: flex; flex-direction: column;">
                <div class="library-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <div class="library-tabs">
                        <button class="lib-tab active">All</button>
                        <button class="lib-tab">Objects</button>
                        <button class="lib-tab">Faces</button>
                    </div>
                    <div class="library-search" style="display: flex; gap: 10px; align-items: center;">
                        <div style="position: relative;">
                            <svg viewBox="0 0 24 24" style="position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--text-muted); fill: none; stroke: currentColor; stroke-width: 2;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="library-search-input" placeholder="Search archives..." class="search-input custom-input" style="padding-left: 36px; background: var(--bg-secondary); border: 1px solid var(--neutral-border); color: var(--text-main); height: 36px; border-radius: 6px; width: 250px;">
                        </div>
                    </div>
                </div>
                
                <div class="library-grid scrollable-panel" id="library-items-container" style="align-content: start; overflow-y: auto; max-height: calc(100vh - 180px); padding-right: 12px;">
                    <!-- Încărcare din JS -->
                </div>
            </section>

            <section id="library-detail-view" style="display: none; height: 100%; gap: 20px;">
                <div class="viewer-container">
                    <div class="viewer-header">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <button class="btn-secondary btn-back" id="btn-back-library">
                                <svg viewBox="0 0 24 24" style="width: 18px; stroke: currentColor; fill:none; stroke-width:2;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            </button>
                            <h2 style="font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--text-main);">Model View</h2>
                        </div>
                        
                        <div style="display: flex; gap: 16px; align-items: center;">
                            <div class="lod-controls" style="display: flex; background: var(--bg-primary); border: 1px solid var(--neutral-border); border-radius: 6px; overflow: hidden;">
                                <button id="btn-fmt-glb" class="lod-btn active">GLB</button>
                                <button id="btn-fmt-stl" class="lod-btn">STL</button>
                            </div>
                            <div class="lod-controls" style="display: flex; background: var(--bg-primary); border: 1px solid var(--neutral-border); border-radius: 6px; overflow: hidden;">
                                <button id="btn-lod-low" class="lod-btn active">Low Quality</button>
                                <button id="btn-lod-high" class="lod-btn">High Quality</button>
                            </div>
                        </div>
                    </div>
                    <div id="model-3d-canvas" style="flex: 1; width: 100%; position: relative;"></div>
                </div>

                <div class="details-sidebar scrollable-panel" style="overflow-y: auto; padding-right: 10px;">
                    <div class="details-card">
                        <h3 class="details-card-title">Item Details</h3>
                        
                        <label class="details-label">Title</label>
                        <input type="text" id="detail-title" class="details-input" style="margin-bottom: 15px;">
                        
                        <label class="details-label">Description</label>
                        <textarea id="detail-desc" class="details-input" rows="4" style="resize: none; margin-bottom: 15px;"></textarea>
                        
                        <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                            <div style="flex: 1;">
                                <label class="details-label">Dimensions (mm)</label>
                                <div id="detail-dims" class="details-value-box">-</div>
                            </div>
                            <div style="flex: 1;">
                                <label class="details-label">Volume (cm³)</label>
                                <div id="detail-vol" class="details-value-box">-</div>
                            </div>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; gap: 10px;">
                            <button class="btn-secondary" id="btn-cancel-edit" style="flex: 1; padding: 10px;">Cancel</button>
                            <button class="btn-primary" id="btn-save-edit" style="flex: 1; padding: 10px; background: var(--accent);">Save Changes</button>
                        </div>
                    </div>

                    <button class="btn-primary btn-export" id="btn-export-model" style="justify-content: center;">
                        <span style="display: flex; align-items: center; gap: 10px;">
                            <svg viewBox="0 0 24 24" style="width: 18px; stroke: currentColor; fill:none; stroke-width:2;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Export to USB
                        </span>
                    </button>

                    <button class="btn-secondary btn-export" id="btn-export-bt" style="justify-content: center;">Send to phone (Bluetooth)</button>
                    <button class="btn-secondary" id="btn-export-bt-cancel" style="display: none; justify-content: center;">Cancel transfer</button>
                    <div id="export-status" style="display: none; font-size: 0.85rem; color: var(--text-muted); text-align: center; white-space: pre-line;"></div>

                    <button class="btn-danger btn-delete" id="btn-delete-model">
                        <svg viewBox="0 0 24 24" style="width: 18px; stroke: currentColor; fill:none; stroke-width:2;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Delete Model
                    </button>
                </div>
            </section>

            <!-- Modals omitted for brevity, exactly the same -->
            <div class="overlay" id="modal-overlay"></div>
            <!-- ... -->
        </main>
    </div>

    <!-- TASTATURA VIRTUALĂ -->
    <div id="keyboard-super-wrapper">
        <div class="keyboardContainer" style="position: relative; width: 100%;">
            <div class="simple-keyboard"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard-autocorrect@latest/build/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swipe-keyboard@latest/build/index.min.js"></script>

    <script src="js/global.js"></script>
    <script src="js/scan-monitor.js"></script>
    <script src="js/network.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/library.js"></script>
    <script src="js/keyboard-init.js"></script>
</body>
</html>
