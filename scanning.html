<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1366, height=768, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCANCORE-3D OS - Scanning</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/ai-chat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">
    <link rel="stylesheet" href="css/keyb.css">
    <!-- CSS Specific -->
    <link rel="stylesheet" href="css/scanning.css">
</head>
<body class="dark-theme">

    <div id="app-wrapper" style="opacity: 1; display: flex; flex-direction: column; height: 100%; width: 100%;">
        
        <!-- HEADER COMUN -->
        <header>
            <div class="brand" data-action="nav" data-target="main-menu" style="cursor: pointer;">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                SCANCORE-3D
            </div>
            <div class="nav-tabs">
                <div class="nav-tab active" data-action="nav" data-target="main-menu">Main Menu</div>
                <div class="nav-tab" data-action="nav" data-target="library">Library</div>
                <div class="nav-tab" data-action="nav" data-target="help-screen">Help</div>
            </div>
            <div class="system-status">
                <span id="clock">00:00</span>
                <svg viewBox="0 0 24 24" class="status-icon" id="btn-theme" title="Toggle Theme"></svg>
                <svg viewBox="0 0 24 24" class="status-icon" data-modal="bt-modal" title="Bluetooth"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-no-net" title="No Network - Click to connect" data-modal="wifi-modal" style="cursor: pointer;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    <line x1="4" y1="4" x2="20" y2="20" stroke-width="3" stroke="var(--bg-primary)"></line>
                    <line x1="4" y1="4" x2="20" y2="20"></line>
                </svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-ethernet" style="display: none;" title="Ethernet Connected">
                    <rect x="4" y="4" width="16" height="12" rx="2" ry="2"></rect><line x1="12" y1="16" x2="12" y2="20"></line><line x1="8" y1="20" x2="16" y2="20"></line>
                </svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-wifi" style="display: none;" data-modal="wifi-modal" title="Wi-Fi">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <svg viewBox="-2 -2 28 28" class="status-icon" id="icon-settings" data-action="nav" data-target="settings-screen" title="Settings">
                    <g transform="scale(0.85) translate(2.1, 2.1)">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </g>
                </svg>
            </div>
        </header>

        <main>
            <section id="scanning" class="screen active">
                <div class="scanning-container">
                    
                    <img id="active-scan-stream" class="camera-stream" style="width: 100%; max-width: 800px; min-height: 450px; border-radius: 8px; background: #000; object-fit: contain;" alt="Camera Stream" />
                    
                    <div class="scan-progress-wrapper scrollable-panel" style="width: 420px; padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto;">
                        <h1 class="scan-title" id="scan-status-title" style="text-align: center; margin-bottom: 5px;">Status: Preparing...</h1>
                        <div id="scan-phase-message" style="color: var(--text-muted); font-size: 0.95rem; text-align: center; min-height: 20px; margin-bottom: 8px; white-space: pre-line;"></div>
                        <!-- cloud_message: technical detail of the cloud processing, small, under the main text -->
                        <div id="scan-cloud-message" style="display: none; color: var(--text-muted); opacity: 0.7; font-family: var(--font-mono); font-size: 0.75rem; text-align: center; margin-bottom: 24px; word-break: break-word;"></div>
                        <!-- upload stalled (seconds_since_last_upload) / server not answering: filled from JS -->
                        <div id="scan-upload-warning" style="display: none; color: #f59e0b; font-size: 0.85rem; text-align: center; margin-bottom: 12px;"></div>
                        <div id="scan-conn-warning" style="display: none; color: #ef4444; font-size: 0.85rem; text-align: center; margin-bottom: 12px;"></div>
                        <div style="margin-bottom: 16px;"></div>

                        <!-- Grup Progress Bar (Apare automat după auto-start) -->
                        <div id="scan-progress-container" style="display: none; width: 100%; margin-bottom: 24px;">
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; font-weight: 600;">
                                <span id="scan-progress-text">Initializing...</span>
                                <span id="scan-progress-pct" style="font-family: var(--font-mono); color: var(--accent);">0%</span>
                            </div>
                            <div style="width: 100%; height: 8px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden; border: 1px solid var(--neutral-border);">
                                <div id="scan-progress-bar" style="height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease;"></div>
                            </div>
                        </div>

                        <!-- Grup Input (Apare doar LA FINAL, când scanarea este "completed") -->
                        <div id="scan-input-group" style="display: none; width: 100%; flex-direction: column; gap: 12px; margin-bottom: 24px; background: var(--bg-secondary); padding: 16px; border-radius: 8px; border: 1px solid var(--neutral-border);">
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                <label style="font-size: 0.9rem; font-weight: 600;">Scan Title</label>
                                <input type="text" id="scan-title-input" class="custom-input" placeholder="e.g. Ancient Vase" style="background: var(--bg-primary); border: 1px solid var(--neutral-border); color: var(--text-main); height: 40px; padding: 0 12px; border-radius: 6px;">
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                <label style="font-size: 0.9rem; font-weight: 600;">Description (Optional)</label>
                                <textarea id="scan-desc-input" class="custom-input" placeholder="Add details..." rows="2" style="background: var(--bg-primary); border: 1px solid var(--neutral-border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; resize: none;"></textarea>
                            </div>
                            <button class="btn-primary" id="btn-save-details" style="width: 100%; justify-content: center; margin-top: 8px; min-height: 50px;">Save & View Library</button>
                            <button class="btn-secondary" id="btn-skip-details" style="width: 100%; justify-content: center; min-height: 40px; font-size: 0.9rem; border: none; color: var(--text-muted);">Skip & View Library</button>
                        </div>

                        <!-- Butoanele de Camera si Cancel -->
                        <div class="scan-actions" id="scan-actions-group" style="width: 100%; display: flex; flex-direction: column; gap: 16px;">
                            <button class="btn-secondary" id="btn-switch-camera" style="width: 100%; justify-content: center; gap: 10px; border-color: var(--accent); color: var(--text-main); display: flex; align-items: center; padding: 12px; cursor: pointer;">
                                <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                                    <polyline points="16 3 21 3 21 8"></polyline>
                                    <line x1="4" y1="20" x2="21" y2="3"></line>
                                    <polyline points="21 16 21 21 16 21"></polyline>
                                    <line x1="15" y1="15" x2="21" y2="21"></line>
                                    <line x1="4" y1="4" x2="9" y2="9"></line>
                                </svg>
                                <span id="switch-cam-text">Switch Camera (Cam 1)</span>
                            </button>

                            <!-- POST /scanner/cloud/retry: shown after an object scan failed (hidden again on a 400) -->
                            <button class="btn-primary" id="btn-retry-cloud" style="display: none; width: 100%; justify-content: center; padding: 12px; min-height: 50px;">↻ Retry reconstruction</button>
                            <!-- face scan: eyes probably closed or no face found -> a new prepare + capture -->
                            <button class="btn-primary" id="btn-retake-face" style="display: none; width: 100%; justify-content: center; padding: 12px; min-height: 50px;">📷 Take the photo again</button>

                            <button class="btn-secondary" id="btn-cancel-scan" style="width: 100%; justify-content: center; border-color: #ef4444; color: #ef4444; padding: 12px; cursor: pointer;">
                                Cancel Scan
                            </button>
                        </div>
                    </div>

                </div>
            </section>

            <!-- MODALS GLOBALE -->
            <div class="overlay" id="modal-overlay"></div>
            <div class="os-modal" id="wifi-modal">
                <!-- modal header ... -->
            </div>
            <!-- etc -->
        </main>
    </div>
    
    <div id="keyboard-super-wrapper">
        <div class="keyboardContainer" style="position: relative; width: 100%;">
            <div class="simple-keyboard"></div>
        </div>
    </div>

    <!-- LIBRĂRII EXTERNE PENTRU TASTATURĂ -->
    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard-autocorrect@latest/build/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swipe-keyboard@latest/build/index.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/network.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/scanning-progress.js"></script>
    <script src="js/keyboard-init.js"></script>
</body>
</html>
