<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1366, height=768, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCANCORE-3D OS - Face Scan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/ai-chat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">
    <link rel="stylesheet" href="css/keyb.css">
    <link rel="stylesheet" href="css/scanner.css">
</head>
<body class="dark-theme">

    <div id="app-wrapper" style="opacity: 1; display: flex; flex-direction: column; height: 100%; width: 100%;">
        <header>
            <div class="brand" data-action="nav" data-target="main-menu" style="cursor: pointer;">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                SCANCORE-3D
            </div>
            <div class="nav-tabs">
                <div class="nav-tab active" data-action="nav" data-target="main-menu">Main Menu</div>
                <div class="nav-tab" data-action="nav" data-target="library">Library</div>
                <div class="nav-tab" data-action="nav" data-target="help-screen">Help</div>
            </div>
            <div class="system-status">
                <span id="clock">00:00</span>
                <svg viewBox="0 0 24 24" class="status-icon" id="btn-theme" title="Toggle Theme"></svg>
                <svg viewBox="0 0 24 24" class="status-icon" data-modal="bt-modal" title="Bluetooth"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-no-net" title="No Network - Click to connect" data-modal="wifi-modal" style="cursor: pointer;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    <line x1="4" y1="4" x2="20" y2="20" stroke-width="3" stroke="var(--bg-primary)"></line>
                    <line x1="4" y1="4" x2="20" y2="20"></line>
                </svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-ethernet" style="display: none;" title="Ethernet Connected">
                    <rect x="4" y="4" width="16" height="12" rx="2" ry="2"></rect><line x1="12" y1="16" x2="12" y2="20"></line><line x1="8" y1="20" x2="16" y2="20"></line>
                </svg>
                <svg viewBox="0 0 24 24" class="status-icon" id="icon-wifi" style="display: none;" data-modal="wifi-modal" title="Wi-Fi">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <svg viewBox="-2 -2 28 28" class="status-icon" id="icon-settings" data-action="nav" data-target="settings-screen" title="Settings">
                    <g transform="scale(0.85) translate(2.1, 2.1)">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </g>
                </svg>
            </div>
        </header>

        <main>
            <section id="scan-face" class="screen active">
                <div class="screen-header">
                    <div class="screen-title-group">
                        <h1><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Face & Biometric Scan</h1>
                        <div class="screen-subtitle">Organic mesh topology optimization enabled.</div>
                    </div>
                </div>
                
                <div class="prescan-layout" style="align-items: flex-start; padding-top: 40px;">
                    <div class="settings-panel scrollable-panel" style="max-height: calc(100vh - 240px); overflow-y: auto; padding-right: 16px; width: 100%; max-width: 900px; margin: 0 auto;">
                        
                        <button class="btn-primary" id="btn-start-face-prep" style="margin-bottom: 12px; width: 100%; height: 50px; font-size: 1.1rem; justify-content: center;">▶ Prepare Face Scan</button>
                        <button class="btn-secondary" id="btn-reset-face-defaults" style="margin-bottom: 24px; width: 100%; justify-content: center; min-height: 40px; font-size: 0.9rem; color: var(--text-muted);">↺ Reset to Defaults</button>

<div class="settings-grid" style="margin-bottom: 16px;">
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 8px;">
                                <label class="setting-row-title">Name (optional)</label>
                                <input type="text" id="cfg-face-title" maxlength="120" placeholder="e.g. Ancient Vase" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border-radius: 6px; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--neutral-border);">
                            </div>
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 8px;">
                                <label class="setting-row-title">Description (optional)</label>
                                <textarea id="cfg-face-desc" maxlength="2000" rows="2" placeholder="Add details..." style="width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 6px; resize: none; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--neutral-border); font-family: inherit;"></textarea>
                            </div>
                        </div>

                        <div class="settings-grid" style="margin-bottom: 24px;">
                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 12px;">
                                <div style="display:flex; justify-content: space-between; align-items: center; width: 100%; gap: 16px;">
                                    <label class="setting-row-title" style="margin:0;">Start Z Height (mm)</label>
                                    <span id="cfg-face-start-z-val" style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">144</span>
                                </div>
                                <input type="range" id="cfg-face-start-z" min="104" max="200" step="8" value="144" style="width: 100%;">
                            </div>

                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 12px;">
                                <div style="display:flex; justify-content: space-between; align-items: center; width: 100%; gap: 16px;">
                                    <label class="setting-row-title" style="margin:0;">Photo Quality (%)</label>
                                    <span id="cfg-face-photo-q-val" style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">95%</span>
                                </div>
                                <input type="range" id="cfg-face-photo-q" min="10" max="100" value="95" style="width: 100%;">
                            </div>

                            <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 12px;">
                                <div style="display:flex; justify-content: space-between; align-items: center; width: 100%; gap: 16px;">
                                    <label class="setting-row-title" style="margin:0;">LED Intensity (%)</label>
                                    <span id="cfg-face-led-val" style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">35%</span>
                                </div>
                                <input type="range" id="cfg-face-led" min="0" max="100" step="5" value="35" style="width: 100%;">
                            </div>
                        </div>

                        <div style="margin-bottom: 16px;">
                            <button class="btn-secondary" id="btn-toggle-adv-face" style="width: 100%; justify-content: center; min-height: 40px; font-size: 0.9rem;">
                                Show Advanced Settings ▼
                            </button>
                        </div>

                        <div id="advanced-settings-container-face" style="display: none; flex-direction: column; gap: 16px; padding-bottom: 16px;">
                            <div class="settings-grid">
                                <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap:8px;">
                                    <label class="setting-row-title">Search Strategy</label>
                                    <select id="cfg-face-strategy" style="width:100%; padding: 8px; border-radius: 6px; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--neutral-border);">
                                        <option value="direct_stop" selected>Direct Stop (Center face)</option>
                                        <option value="sweep_best_score">Sweep & Best Score</option>
                                        <option value="none">None (Use Manual Z)</option>
                                    </select>
                                </div>

                                <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 12px;">
                                    <div style="display:flex; justify-content: space-between; align-items: center; width: 100%; gap: 16px;">
                                        <label class="setting-row-title" style="margin:0;">Search Range (mm)</label>
                                        <span id="cfg-face-search-range-val" style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">48</span>
                                    </div>
                                    <input type="range" id="cfg-face-search-range" min="16" max="144" step="8" value="48" style="width: 100%;">
                                </div>

                                <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 12px;">
                                    <div style="display:flex; justify-content: space-between; align-items: center; width: 100%; gap: 16px;">
                                        <label class="setting-row-title" style="margin:0;">Step (mm)</label>
                                        <span id="cfg-face-step-val" style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">8</span>
                                    </div>
                                    <input type="range" id="cfg-face-step" min="8" max="24" step="8" value="8" style="width: 100%;">
                                </div>

                                <div class="setting-row-box" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 12px;">
                                    <div style="display:flex; justify-content: space-between; align-items: center; width: 100%; gap: 16px;">
                                        <label class="setting-row-title" style="margin:0;">Z-Axis Delay (s)</label>
                                        <span id="cfg-face-delay-z-val" style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">0.0010</span>
                                    </div>
                                    <input type="range" id="cfg-face-delay-z" min="0.001" max="0.003" step="0.0002" value="0.001" style="width: 100%;">
                                </div>

                                <div class="setting-row-box" id="box-face-manual-z" style="padding: 16px; flex-direction: column; align-items: flex-start; gap: 12px; opacity: 0.5; pointer-events: none;">
                                    <div style="display:flex; justify-content: space-between; align-items: center; width: 100%; gap: 16px;">
                                        <label class="setting-row-title" style="margin:0;">Manual Z (mm)</label>
                                        <span id="cfg-face-manual-z-val" style="font-family: var(--font-mono); font-weight: 600; color: var(--accent);">200</span>
                                    </div>
                                    <input type="range" id="cfg-face-manual-z" min="152" max="248" step="8" value="200" style="width: 100%;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- MODALS GLOBALE (Wi-Fi, BT, AI) -->
            <div class="overlay" id="modal-overlay"></div>
            <!-- Modals ommited for brevity, they are exactly the same as before -->

            <div class="fab" id="btn-fab">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path></svg>
                <div><div style="font-size: 0.95rem;">SCANASSIST</div><div style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">AI Guidance</div></div>
            </div>

        </main>
    </div>

    <!-- TASTATURĂ VIRTUALĂ -->
    <div id="keyboard-super-wrapper">
        <div class="keyboardContainer" style="position: relative; width: 100%;">
            <div class="simple-keyboard"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard-autocorrect@latest/build/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swipe-keyboard@latest/build/index.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/scan-monitor.js"></script>
    <script src="js/network.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/keyboard-init.js"></script>
</body>
</html>
